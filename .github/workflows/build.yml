name: Build Windows App

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build EXE
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name "Ping Monitor" --icon "PingMonitor.ico" --add-data "PingMonitor.ico;." main.py

      - name: Prepare portable release
        run: |
          New-Item -ItemType Directory -Force -Path artifact
          Copy-Item "dist\Ping Monitor.exe" "artifact\Ping Monitor.exe" -Force
          Copy-Item "PingMonitor.ico" "artifact\PingMonitor.ico" -Force

      - name: Upload portable build
        uses: actions/upload-artifact@v4
        with:
          name: PingMonitor-Windows
          path: artifact/